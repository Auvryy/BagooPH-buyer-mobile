name: bagoo_buyer_mobile
description: "BagooPH buyer mobile app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  file_selector: ^1.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  html: ^0.15.7
  pdfrx: ^2.10.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/auth/
    - assets/fonts/OFL.txt
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
