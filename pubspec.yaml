name: bagoo_buyer_mobile
description: "BagooPH buyer mobile app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  app_links: ^7.2.2
  barcode_widget: ^2.0.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  html: ^0.15.7
  pdfrx: ^2.10.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/auth/
    - assets/fonts/OFL.txt
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
